<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หุบเขาแห่งกาลเวลา: ถิ่นฐานมนุษย์ก่อนประวัติศาสตร์</title>
<meta name="description" content="สื่อการเรียนรู้เชิงเกม ประวัติศาสตร์ ม.1 การแบ่งยุคสมัยก่อนประวัติศาสตร์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EFE6D2;          /* bone */
  --paper:#FBF6EA;
  --ink:#24302F;         /* cave slate */
  --muted:#5E6762;
  --line:#CDBFA2;
  --ochre:#9E2F25;       /* cave-painting pigment */
  --amber:#C9801F;       /* lantern / fire */
  --rice:#4E7A3A;        /* paddy */
  --patina:#3E7566;      /* bronze patina */
  --iron:#4A4F57;
  --ok:#2F6B3E; --okbg:#E1EFD9;
  --bad:#9E2F25; --badbg:#F6DFD9;
  --accent:var(--amber);
  --shadow:0 2px 0 rgba(36,48,47,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C2426; --paper:#263134; --ink:#EDE3CF; --muted:#A9B0A8; --line:#3D4A4C;
    --ochre:#E0775F; --amber:#EBAA4C; --rice:#8DBE72; --patina:#77B8A6; --iron:#AEB4BD;
    --ok:#9BD3A6; --okbg:#203A2A; --bad:#F09A85; --badbg:#3E2420;
    --shadow:0 2px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1C2426; --paper:#263134; --ink:#EDE3CF; --muted:#A9B0A8; --line:#3D4A4C;
  --ochre:#E0775F; --amber:#EBAA4C; --rice:#8DBE72; --patina:#77B8A6; --iron:#AEB4BD;
  --ok:#9BD3A6; --okbg:#203A2A; --bad:#F09A85; --badbg:#3E2420;
  --shadow:0 2px 0 rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Leelawadee UI","Tahoma",sans-serif;font-size:18px;line-height:1.7}
h1,h2,h3,h4{font-family:"Kanit","Sarabun","Tahoma",sans-serif;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:980px;margin:0 auto;padding:16px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.bar h1{font-size:1.05rem;font-weight:600;flex:1;min-width:180px}
.bar h1 small{display:block;font-family:"Sarabun",sans-serif;font-weight:400;font-size:.8rem;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:2px 12px;font-size:.9rem}
:root[data-theme="dark"] .bar, :root:not([data-theme="light"]) .bar{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar{background:#11181A;color:var(--ink)}}
:root[data-theme="dark"] .bar{background:#11181A;color:var(--ink)}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:2px 10px;color:inherit}

/* home */
.hero{padding:28px 0 8px}
.hero h2{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;letter-spacing:-.01em}
.hero p{max-width:62ch;color:var(--muted);margin:.5em 0 0}
.team{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
.team input{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:220px}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:22px 0}
.file{position:relative;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:4px 14px 4px 4px;padding:30px 18px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.file:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.file::before{content:"";position:absolute;top:-14px;left:-2px;width:46%;height:14px;background:var(--fc);border:2px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0}
.file .num{font-family:"Kanit",sans-serif;font-size:3rem;line-height:1;color:var(--fc);font-weight:700}
.file h3{font-size:1.25rem;margin:6px 0 2px}
.file .era{color:var(--muted);font-size:.95rem}
.file .em{font-size:2rem;position:absolute;right:16px;top:18px}
.file[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--line);border-color:var(--line)}
.stampmini{position:absolute;right:14px;bottom:14px;border:2px solid var(--ok);color:var(--ok);font-family:"Kanit",sans-serif;font-weight:600;font-size:.8rem;padding:0 8px;border-radius:4px;transform:rotate(-8deg)}

/* station */
.crumb{background:none;border:none;color:var(--muted);padding:4px 0;font-size:.95rem}
.case-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:6px 0 14px;border-bottom:3px solid var(--accent);padding-bottom:12px}
.case-head h2{font-size:clamp(1.5rem,4vw,2.2rem)}
.case-head .era{color:var(--accent);font-family:"Kanit",sans-serif;font-weight:600}
.timer{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;min-width:250px}
.timer .t{font-family:"Kanit",sans-serif;font-size:1.9rem;font-weight:700;line-height:1}
.timer .ph{font-size:.88rem;color:var(--muted)}
.timer .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer .btns{display:flex;gap:6px}
.tbtn{border:2px solid var(--ink);background:var(--bg);border-radius:8px;padding:2px 10px;font-size:.9rem}
.phases{display:flex;gap:4px;margin-top:6px}
.phases span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.phases span.on{background:var(--accent)}
.timer.ring{animation:ring .5s 4}
@keyframes ring{50%{background:var(--badbg)}}

.tabs{display:flex;gap:6px;margin:10px 0 18px;overflow-x:auto}
.tab{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 16px;white-space:nowrap;font-family:"Kanit",sans-serif;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .n{display:inline-block;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;border-radius:50%;background:var(--accent);color:#fff;font-size:.8rem;margin-right:6px}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h3{font-size:1.2rem;margin-bottom:8px}
.record{border-left:5px solid var(--accent);padding-left:14px}
.muted{color:var(--muted)}
.hl{color:var(--ochre);font-weight:700}

/* evidence */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ev{position:relative;background:var(--bg);border:2px dashed var(--line);border-radius:10px;padding:14px 10px;text-align:center}
.ev .ic{font-size:2.4rem;display:block}
.ev .nm{font-family:"Kanit",sans-serif;font-weight:500;font-size:.98rem}
.ev .tag{position:absolute;top:6px;left:8px;font-size:.75rem;color:var(--muted)}
.ev.seen{border-style:solid;border-color:var(--accent)}
.ev.seen::after{content:"✓";position:absolute;top:4px;right:8px;color:var(--accent);font-weight:700}
.ev-detail{margin-top:14px;padding:14px;border-radius:10px;background:var(--bg);border:2px solid var(--accent);display:none}
.ev-detail.show{display:block}
.progress{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* clue interactions */
.reveal-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.reveal{background:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:12px;text-align:left;min-height:110px}
.reveal .ic{font-size:1.8rem}
.reveal .back{display:none;font-size:.95rem}
.reveal.open{border-color:var(--accent)}
.reveal.open .back{display:block}
.reveal.open .hint{display:none}
.reveal .hint{color:var(--muted);font-size:.9rem}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.chain .node{padding:8px 12px;border-radius:8px;border:2px solid var(--line);background:var(--bg);opacity:.35}
.chain .node.on{opacity:1;border-color:var(--accent)}
.chain .arr{color:var(--muted)}
.stepper{margin-top:10px}
.stepper .stage{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:10px;padding:14px;border:2px solid var(--accent);min-height:120px}
.stepper .stage .ic{font-size:3rem}
.stepper .ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}

/* furnace lab */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.lab{grid-template-columns:1fr}}
.ores{display:flex;flex-wrap:wrap;gap:8px}
.ore{border:2px solid var(--ink);background:var(--bg);border-radius:10px;padding:8px 12px}
.ore[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.furnace{border-radius:14px;background:linear-gradient(#5b4636,#2d2420);color:#FBEBD0;padding:16px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.furnace .slot{font-size:2rem;min-height:2.4rem}
.furnace.hot{animation:glow 1.2s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 30px 6px #E8742A}}
.bars{display:grid;gap:8px;margin-top:8px}
.bars .b{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.95rem}
.bars .b div{height:16px;border-radius:4px;background:var(--line)}
.bars .b div i{display:block;height:100%;border-radius:4px}

/* puzzles */
.pz{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:18px;margin-bottom:16px}
.pz .q{font-family:"Kanit",sans-serif;font-weight:500;font-size:1.1rem;margin-bottom:10px}
.pz .q .qn{color:var(--accent);margin-right:6px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.pz .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 18px;font-family:"Kanit",sans-serif;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.fb.no{display:block;background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.fb.hint{display:block;background:var(--bg);color:var(--ink);border:1px dashed var(--accent)}
.fb p{margin:.2em 0;color:var(--ink)}
.solved{border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ochip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px}
.ochip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.seq{min-height:56px;border:2px dashed var(--accent);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.seq .ph{color:var(--muted);font-size:.95rem;padding:6px}
.seq .it{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:6px 10px;text-align:left}
.seq .it b{font-family:"Kanit",sans-serif;color:var(--accent);min-width:1.4em}
.sort-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sort-row .sb{display:flex;gap:6px}
.sort-row.right{background:var(--okbg)} .sort-row.wrong{background:var(--badbg)}

/* stamp moment */
.closed{position:relative;text-align:center;padding:28px 18px;border:3px double var(--ok);border-radius:12px;background:var(--paper);margin:10px 0 20px}
.stamp{display:inline-block;font-family:"Kanit",sans-serif;font-weight:700;font-size:2rem;color:var(--ok);border:5px solid var(--ok);padding:4px 20px;border-radius:8px;transform:rotate(-7deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.4);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
textarea{width:100%;min-height:110px;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.cert{border:4px double var(--ink);padding:24px;border-radius:6px;background:var(--paper);text-align:center}
.cert h3{font-size:1.6rem}
.kw{display:inline-block;background:var(--okbg);color:var(--ok);border-radius:6px;padding:0 8px;margin:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-family:"Kanit",sans-serif;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

/* ---------- games ---------- */
.game h3{font-size:1.25rem}
.arena{position:relative;border-radius:14px;overflow:hidden;min-height:330px;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin-top:10px}
.arena.cave{height:400px;background:radial-gradient(circle at 50% 55%,rgba(255,165,60,calc(var(--glow,.6)*.6)),transparent 58%),linear-gradient(#2e2723,#14100e)}
.arena .paint{position:absolute;top:7%;left:6%;font-size:1.5rem;opacity:.35;filter:sepia(1) saturate(3) hue-rotate(-25deg);pointer-events:none}
.sprite{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:6px;font-size:2.4rem;line-height:1;cursor:pointer;z-index:2}
.sprite.flip{transform:translate(-50%,-50%) scaleX(-1)}
.fire{left:50%;top:55%;pointer-events:none;filter:drop-shadow(0 0 14px #ff9a2a);transition:font-size .2s,opacity .3s;z-index:1}
.wood{left:50%;top:86%;font-size:2rem;background:rgba(255,255,255,.14);border-radius:14px;padding:4px 14px}
.wood small{display:block;font-size:.75rem;color:#f6e7cf;font-family:"Kanit",sans-serif}
.meat.cooking{animation:sizzle .35s infinite alternate}
.meat.ready{filter:drop-shadow(0 0 12px #ffd36a)}
@keyframes sizzle{to{transform:translate(-50%,-50%) scale(1.15)}}
.arena.hurt{animation:hurt .45s}
@keyframes hurt{30%{box-shadow:inset 0 0 0 9999px rgba(200,20,20,.35)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(18,22,22,.86);color:#fff;text-align:center;padding:18px}
.ov h3{color:#fff;font-size:1.4rem}
.ov p{max-width:54ch;margin:0;color:#f1e9d8}
.ovb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.ov .btn{background:#fff;color:#1C2426;border-color:#fff}
.ov .btn.ghost{background:transparent;color:#fff}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:"Kanit",sans-serif;font-weight:700;font-size:1.3rem;color:#FFD36A;pointer-events:none;animation:pop .9s forwards;z-index:4;text-shadow:0 1px 3px #000}
@keyframes pop{to{transform:translate(-50%,-190%);opacity:0}}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.95rem;margin-top:8px;min-height:1.8em}
.hud .meter{display:inline-flex;align-items:center;gap:6px}
.hud .meter i{display:inline-block;width:110px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hud .meter b{display:block;height:100%;background:var(--amber)}
.warn{color:var(--bad);font-weight:700}
.arena.knap{height:340px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#efe2c6,#c9b48d)}
#kS{width:min(330px,92%);height:auto;overflow:visible}
.core{fill:#6f6b64;stroke:#4a4741;stroke-width:2;cursor:pointer;transition:stroke .3s}
.core.sharp{stroke:#E8A33D;stroke-width:5}
.flake{cursor:pointer;transition:transform .55s,opacity .55s;transform-box:fill-box;transform-origin:center}
.flake polygon{fill:#a29c90;stroke:#4a4741;stroke-width:1.5}
.flake:hover polygon,.flake:focus polygon{fill:#bdb6a8}
.flake.off{opacity:0;pointer-events:none}
.crack{fill:none;stroke:#3a3732;stroke-width:1.6}
.khud{position:absolute;left:12px;right:12px;bottom:8px;display:flex;justify-content:space-between;color:#3a3229;font-size:.95rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.arena.farm{background:linear-gradient(#d5e8ad,#9cbf68);padding:10px;display:flex;flex-direction:column;gap:10px;color:#2c3a1d}
.wild{position:relative;height:56px;border-bottom:2px dashed rgba(0,0,0,.2)}
.wild .sprite{top:50%}
.wild .lbl{position:absolute;left:6px;top:2px;font-size:.8rem;opacity:.7}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plot{position:relative}
.pbtn{width:100%;height:92px;background:#8a6a45;border:3px solid #5b4329;border-radius:12px;font-size:2.4rem;display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
.plot.ripe .pbtn{background:#b88d3a}
.plot.dead .pbtn{background:#6b5a48}
.need{position:absolute;top:4px;left:6px;font-size:1.3rem;animation:bob .7s infinite alternate}
.grow{position:absolute;left:10px;right:10px;bottom:7px;height:6px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}
.grow b{display:block;height:100%;background:#dff59a}
.pest{position:absolute;top:-12px;right:-8px;font-size:2rem;background:rgba(255,255,255,.75);border:3px solid #9E2F25;border-radius:50%;padding:2px 4px;line-height:1;animation:bob .3s infinite alternate;z-index:2}
@keyframes bob{to{transform:translateY(-4px)}}
.village{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:1.7rem;min-height:2.4rem}
.village .vl{font-size:.85rem;opacity:.75;display:block}
.pen{font-size:1.4rem;background:rgba(255,255,255,.4);padding:2px 10px;border-radius:8px}
.river{background:#6aa7c9;color:#e8f4fb;text-align:center;border-radius:8px;font-size:.85rem}
.arena.smithy{background:linear-gradient(#3a2c24,#1b1512);color:#f6e7cf;min-height:380px;padding:16px}
.fz{display:flex;gap:18px;align-items:stretch;min-height:340px}
.gauge{position:relative;width:36px;background:#2a211c;border:2px solid #7a6150;border-radius:18px;overflow:hidden;flex:none}
.zone{position:absolute;left:0;right:0;z-index:2;background:rgba(150,230,150,.28);border-top:3px solid #8fd18f;border-bottom:3px solid #8fd18f}
.lvl{position:absolute;left:5px;right:5px;bottom:0;background:linear-gradient(#ffcf5a,#e8502a);border-radius:12px}
.lvl.in{background:linear-gradient(#d2f7b0,#4fbf5a)}
.fstage,.testA{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.fe{line-height:1;filter:drop-shadow(0 0 14px #ff8a2a);font-size:3rem}
.temp{font-family:"Kanit",sans-serif;font-size:1.9rem;font-weight:700}
.melt,.fieldbar{width:min(320px,100%);height:16px;background:#2a211c;border-radius:8px;overflow:hidden;border:1px solid #7a6150}
.melt b,.fieldbar b{display:block;height:100%;width:0;background:#8fd18f;transition:width .1s}
.fieldbar b{background:#b88d3a}

let LOOPS=[];
function loop(fn,ms){const h=setInterval(fn,ms);LOOPS.push(h);return h}
function stopLoops(){LOOPS.forEach(clearInterval);LOOPS=[]}
let AC=null;
function sfx(f=440,d=.12,type="sine",v=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function ov(box,html,btns){box.querySelector(".ov")?.remove();const d=document.createElement("div");d.className="ov";d.innerHTML=html+`<div class="ovb"></div>`;btns.forEach(b=>{const x=document.createElement("button");x.className="btn"+(b.ghost?" ghost":"");x.textContent=b.t;x.onclick=()=>{d.remove();b.fn()};d.querySelector(".ovb").appendChild(x)});box.appendChild(d);return d}
function pop(box,text,x,y){const p=document.createElement("div");p.className="pop";p.textContent=text;p.style.left=x+"%";p.style.top=y+"%";box.appendChild(p);setTimeout(()=>p.remove(),900)}
function spr(box,em,x,y,cls,label){const b=document.createElement("button");b.className="sprite "+cls;b.textContent=em;b.style.left=x+"%";b.style.top=y+"%";b.setAttribute("aria-label",label);box.appendChild(b);return b}

function stepper(sel,stages){
 const el=$(sel);let i=0;
 const draw=()=>{const s=stages[i];el.innerHTML=`<div class="stage"><span class="ic" aria-hidden="true">${s[0]}</span><div><b>${i+1}. ${s[1]}</b><div>${s[2]}</div></div></div>
 <div class="ctrl"><button class="tbtn" ${i===0?"disabled":""} data-d="-1">◀ ก่อนหน้า</button><div class="dots">${stages.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div><button class="tbtn" ${i===stages.length-1?"disabled":""} data-d="1">ถัดไป ▶</button></div>`;
 el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{i+=+b.dataset.d;draw()})};draw();
}

function head(p,k){return `<div class="q"><span class="qn">ปริศนา ${k+1}</span>${p.q}</div>`}
function fbHTML(){return `<div class="fb" aria-live="polite"></div>`}
function showFb(el,kind,html){const f=el.querySelector(".fb");f.className="fb "+kind;f.innerHTML=html}
function renderPuzzle(p,k,n){
 const el=$("#pz-"+p.id);const done=!!S.solved[p.id];el.classList.toggle("solved",done);p._tries=p._tries||0;
 const okMsg=()=>`<b>✓ ถูกต้อง! +${S.ledger["pz:"+p.id]||0} คะแนน</b><p>${p.ex}</p>`;
 const hintBtn=done?"":`<button class="btn ghost" data-hint>ขอคำใบ้</button>`;
 const bindHint=()=>{const h=el.querySelector("[data-hint]");if(h)h.onclick=()=>showFb(el,"hint","💡 "+p.hint)};

 if(p.type==="mcq"){
  el.innerHTML=head(p,k)+`<div class="opts">${p.opts.map((o,i)=>`<button class="opt ${done&&i===p.ans?"right":""}" data-i="${i}" ${done?"disabled":""}>${o}</button>`).join("")}</div><div class="actions">${hintBtn}</div>`+fbHTML();
  // Thai choice letters ก ข ค ง
  const L=["ก","ข","ค","ง"];el.querySelectorAll(".opt").forEach((b,i)=>b.textContent=`${L[i]}. ${p.opts[i]}`);
  if(done)showFb(el,"ok",okMsg());
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
   if(i===p.ans){b.classList.add("right");award(p,n);el.querySelectorAll(".opt").forEach(x=>x.disabled=true);el.classList.add("solved");el.querySelector("[data-hint]")?.remove();showFb(el,"ok",okMsg())}
   else{p._tries++;b.classList.add("wrong");b.disabled=true;showFb(el,"no","✗ ยังไม่ใช่ ลองย้อนไปดูหลักฐานแล้วคิดอีกครั้ง")}});
  bindHint();
 }

 if(p.type==="multi"){
  const sel=new Set(done?p.ans:[]);
  el.innerHTML=head(p,k)+`<div class="chips">${p.opts.map((o,i)=>`<button class="ochip" aria-pressed="${sel.has(i)}" data-i="${i}" ${done?"disabled":""}>${o}</button>`).join("")}</div>
  <div class="actions">${done?"":`<button class="btn" data-check disabled>ตรวจคำตอบ (เลือกแล้ว 0/${p.pick})</button>`}${hintBtn}</div>`+fbHTML();
  if(done)showFb(el,"ok",okMsg());
  const chk=el.querySelector("[data-check]");
  el.querySelectorAll(".ochip").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i))sel.delete(i);else if(sel.size<p.pick)sel.add(i);b.setAttribute("aria-pressed",sel.has(i));chk.disabled=sel.size!==p.pick;chk.textContent=`ตรวจคำตอบ (เลือกแล้ว ${sel.size}/${p.pick})`});
  if(chk)chk.onclick=()=>{const right=p.ans.filter(i=>sel.has(i)).length;
   if(right===p.pick){award(p,n);renderPuzzle(p,k,n)}else{p._tries++;showFb(el,"no",`✗ ถูก ${right} จาก ${p.pick} ข้อ ลองเปลี่ยนตัวเลือกที่ไม่ใช่ประโยชน์ของไฟในยุคนี้`)}};
  bindHint();
 }

 if(p.type==="order"){
  let seq=done?p.items.map((_,i)=>i):[];const pool=p._pool||(p._pool=shuffle(p.items.map((_,i)=>i)));
  const draw=()=>{
   el.innerHTML=head(p,k)+`<div class="seq">${seq.length?seq.map((i,x)=>`<button class="it" data-rm="${x}" ${done?"disabled":""}><b>${x+1}</b>${p.items[i]}</button>`).join(""):'<div class="ph">แตะตัวเลือกด้านล่างเพื่อเรียงลำดับ (แตะในกรอบนี้เพื่อเอาออก)</div>'}</div>
   <div class="chips">${pool.filter(i=>!seq.includes(i)).map(i=>`<button class="ochip" data-add="${i}">${p.items[i]}</button>`).join("")}</div>
   <div class="actions">${done?"":`<button class="btn" data-check ${seq.length===p.items.length?"":"disabled"}>ตรวจลำดับ</button><button class="btn ghost" data-clear>ล้าง</button>`}${hintBtn}</div>`+fbHTML();
   if(done)showFb(el,"ok",okMsg());
   el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{seq.push(+b.dataset.add);draw()});
   el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{seq.splice(+b.dataset.rm,1);draw()});
   el.querySelector("[data-clear]")?.addEventListener("click",()=>{seq=[];draw()});
   const c=el.querySelector("[data-check]");if(c)c.onclick=()=>{const wrongAt=seq.findIndex((v,i)=>v!==i);
    if(wrongAt<0){award(p,n);done=true;el.classList.add("solved");draw()}else{p._tries++;showFb(el,"no",`✗ ลำดับที่ ${wrongAt+1} ยังไม่ถูก ลำดับก่อนหน้านั้นถูกต้องแล้ว ลองแก้ตั้งแต่ข้อนั้นเป็นต้นไป`)}};
   bindHint();
  };draw();
 }

 if(p.type==="mix"){
  const sel=new Set(done?p.ans:[]);
  el.innerHTML=head(p,k)+`<div class="lab"><div class="ores">${p.opts.map((o,i)=>`<button class="ore" aria-pressed="${sel.has(i)}" data-i="${i}" ${done?"disabled":""}>${o[0]} ${o[1]}</button>`).join("")}</div>
  <div class="furnace" id="fz-${p.id}"><div class="slot">${[...sel].map(i=>p.opts[i][0]).join(" + ")||"·"}</div><div class="fm">${done?"ได้สำริด 🟢":"เลือกแร่ 2 ชนิด แล้วกดหลอม"}</div>
  ${done?"":`<button class="tbtn" data-check disabled style="background:#E8742A;color:#fff;border-color:#E8742A;align-self:center">🔥 หลอมแร่</button>`}</div></div>
  <div class="actions">${hintBtn}</div>`+fbHTML();
  if(done)showFb(el,"ok",okMsg());
  const fz=el.querySelector(".furnace"),chk=el.querySelector("[data-check]");
  const paint=()=>{fz.querySelector(".slot").textContent=[...sel].map(i=>p.opts[i][0]).join(" + ")||"·";if(chk)chk.disabled=sel.size!==2};
  el.querySelectorAll(".ore").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i))sel.delete(i);else if(sel.size<2)sel.add(i);b.setAttribute("aria-pressed",sel.has(i));paint()});
  if(chk)chk.onclick=()=>{fz.classList.remove("hot");void fz.offsetWidth;fz.classList.add("hot");fz.querySelector(".fm").textContent="กำลังหลอม...";chk.disabled=true;
   setTimeout(()=>{const ok=p.ans.every(i=>sel.has(i));
    if(ok){award(p,n);renderPuzzle(p,k,n)}else{p._tries++;fz.querySelector(".slot").textContent="💨";fz.querySelector(".fm").textContent="หลอมแล้วไม่ได้สำริด";showFb(el,"no","✗ ส่วนผสมนี้ไม่ใช่สำริด ลองเลือกใหม่");chk.disabled=false}},900)};
  bindHint();
 }

 if(p.type==="sort"){
  const pick=done?p.items.map(x=>x[1]):p.items.map(()=>null);
  const draw=()=>{
   el.innerHTML=head(p,k)+p.items.map((it,i)=>`<div class="sort-row" data-r="${i}"><span>${it[0]}</span><span class="sb">${p.bins.map((b,j)=>`<button class="ochip" aria-pressed="${pick[i]===j}" data-i="${i}" data-j="${j}" ${done?"disabled":""}>${b}</button>`).join("")}</span></div>`).join("")+
   `<div class="actions">${done?"":`<button class="btn" data-check ${pick.includes(null)?"disabled":""}>ตรวจคำตอบ</button>`}${hintBtn}</div>`+fbHTML();
   if(done)showFb(el,"ok",okMsg());
   el.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{pick[+b.dataset.i]=+b.dataset.j;draw()});
   const c=el.querySelector("[data-check]");if(c)c.onclick=()=>{let bad=0;p.items.forEach((it,i)=>{const r=el.querySelector(`[data-r="${i}"]`);const ok=pick[i]===it[1];r.classList.toggle("right",ok);r.classList.toggle("wrong",!ok);if(!ok)bad++});
    if(!bad){award(p,n);done=true;el.classList.add("solved");draw()}else{p._tries++;showFb(el,"no",`✗ ยังจัดผิด ${bad} ข้อ (แถบสีแดง) ลองแก้แล้วตรวจอีกครั้ง`)}};
   bindHint();
  };draw();
 }
}


function knap(el,onWin){
 el.innerHTML=`<h3>🪨 ภารกิจที่ 1: ช่างกะเทาะหิน</h3><p class="muted" style="margin:.3em 0 0">แตะที่<b>ขอบหิน</b>ซึ่งมีรอยร้าว เพื่อกะเทาะสะเก็ดออกจนเกิดคมรอบด้าน ระวัง! ถ้าทุบโดน<b>กลางก้อน</b> 3 ครั้ง หินจะแตกเสียหาย</p>
 <div class="arena knap" id="kA"><svg id="kS" viewBox="0 0 220 230" role="img" aria-label="ก้อนหินสำหรับกะเทาะ"></svg><div class="khud" id="kH"></div></div>`;
 const box=$("#kA"),svg=$("#kS"),hud=$("#kH");let left=0,miss=0;
 const paint=()=>hud.innerHTML=`<span>สะเก็ดที่เหลือ: <b>${left}</b></span><span>ทุบพลาด: <b>${"✖".repeat(miss)}${"○".repeat(3-miss)}</b></span>`;
 function build(){
  const N=10,cx=110,cy=122,pts=[];
  for(let i=0;i<N;i++){const a=i*2*Math.PI/N-Math.PI/2;const tip=Math.pow(Math.max(0,Math.cos(a+Math.PI/2)),3);const ri=42+44*tip;pts.push({a,ri,ro:Math.max(ri+16,80+Math.random()*12)})}
  const P=(a,r)=>`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`;
  let h="";
  pts.forEach((p,i)=>{const q=pts[(i+1)%N],a2=p.a+2*Math.PI/N,am=p.a+Math.PI/N,rm=(p.ri+q.ri)/2,ro=Math.min(p.ro,q.ro);
   h+=`<g class="flake" data-am="${am}" tabindex="0" role="button" aria-label="สะเก็ดหินที่ ${i+1}"><polygon points="${P(p.a,p.ri)} ${P(p.a,p.ro)} ${P(a2,q.ro)} ${P(a2,q.ri)}"/><path class="crack" d="M${P(am-.06,rm+2)} L${P(am+.05,(rm+ro)/2)} L${P(am-.03,ro-4)}"/></g>`});
  h=`<polygon class="core" points="${pts.map(p=>P(p.a,p.ri)).join(" ")}"/>`+h;
  svg.innerHTML=h;left=N;miss=0;paint();
  svg.querySelectorAll(".flake").forEach(g=>{const hit=e=>{e.stopPropagation();if(g.classList.contains("off"))return;const am=+g.dataset.am;g.style.transform=`translate(${Math.cos(am)*70}px,${Math.sin(am)*70}px) rotate(${Math.random()*90-45}deg)`;g.classList.add("off");left--;sfx(650+Math.random()*350,.06,"square",.07);paint();if(left===0)win()};
   g.addEventListener("click",hit);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();hit(e)}})});
  svg.querySelector(".core").addEventListener("click",()=>{if(left===0)return;miss++;sfx(110,.22,"sawtooth",.12);box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");paint();
   if(miss>=3)ov(box,`<h3>💥 หินแตกเป็นเสี่ยง!</h3><p>ช่างหินโบราณต้องเคาะที่ขอบหินทีละน้อย ไม่ใช่ทุบกลางก้อน</p>`,[{t:"เลือกหินก้อนใหม่",fn:build}])});
 }
 function win(){svg.querySelector(".core").classList.add("sharp");
  setTimeout(()=>ov(box,`<h3>🪓 ได้ขวานหินกะเทาะแล้ว!</h3><p>เครื่องมือหินกะเทาะหยาบ ๆ แบบนี้คือหลักฐานของ<b>ยุคหินเก่า</b> ใช้สับ ตัด ขูดเนื้อสัตว์ แม้จะหยาบ แต่แสดงว่ามนุษย์เริ่มคิดประดิษฐ์เครื่องมือแล้ว</p>`,[{t:"รับโบนัส กลับถิ่นฐาน",fn:onWin}]),600)}
 build();
 ov(box,`<h3>🪨 พร้อมเป็นช่างหินโบราณไหม?</h3><p>ในมือมีหินก้อนหนึ่งกับหินค้อน ทำให้มันมีคมเพื่อใช้ล่าสัตว์</p>`,[{t:"เริ่มกะเทาะ",fn:()=>{}}]);
}

function night(el,onWin){
 el.innerHTML=`<h3>🔥 ภารกิจที่ 2: คืนแรกในถ้ำ</h3><p class="muted" style="margin:.3em 0 0">เอาตัวรอดให้ครบ 30 วินาที: แตะ 🪵 เติมฟืนอย่าให้ไฟดับ แตะ 🐺 เพื่อไล่ด้วยคบไฟ แตะ 🥩 เพื่อนำมาย่าง พอสุกเป็น 🍖 แตะเพื่อกิน</p>
 <div class="hud" id="nH"></div>
 <div class="arena cave" id="nA"><div class="paint" aria-hidden="true">🦌 🏹 🦌 🐗</div><div class="sprite fire" id="nF">🔥</div><button class="sprite wood" id="nW" aria-label="เติมฟืน">🪵<small>เติมฟืน</small></button></div>`;
 const box=$("#nA"),hud=$("#nH"),fire=$("#nF");
 let G={t:30,fuel:70,lives:3,scared:0,brains:0,over:true};
 const paintH=()=>hud.innerHTML=`<span>⏱ ${Math.ceil(G.t)} วิ</span><span class="meter">🔥 ฟืน <i><b style="width:${G.fuel}%"></b></i></span><span>${"❤️".repeat(G.lives)}${"🤍".repeat(3-G.lives)}</span><span>🐺 ไล่ได้ ${G.scared}</span><span>🧠 อาหารสุก ${G.brains}</span>${G.fuel<=0?'<span class="warn">❄️ ไฟดับ หนาวมาก!</span>':""}`;
 function start(){box.querySelectorAll(".wolf,.meat").forEach(x=>x.remove());G={t:30,fuel:70,lives:3,scared:0,brains:0,cold:0,wolves:[],meat:null,cd:0,over:false};loop(tick,100)}
 $("#nW").onclick=()=>{if(G.over||G.cd>0)return;G.fuel=Math.min(100,G.fuel+22);G.cd=6;sfx(220,.1,"triangle");pop(box,"+ฟืน",50,76)};
 function tick(){if(G.over)return;
  G.t-=.1;G.cd=Math.max(0,G.cd-1);G.fuel=Math.max(0,G.fuel-.16);
  if(G.fuel<=0){G.cold+=.1;if(G.cold>=4)return end(false,"ไฟดับนานเกินไป ทุกคนหนาวจนทนไม่ไหว ❄️")}else G.cold=Math.max(0,G.cold-.2);
  fire.style.fontSize=(1.2+G.fuel/100*3.6)+"rem";fire.style.opacity=G.fuel>0?1:.2;box.style.setProperty("--glow",(G.fuel/100).toFixed(2));
  if(Math.random()<(G.fuel<35?.06:.035)){const a=Math.random()*Math.PI*2;const w={x:Math.min(95,Math.max(5,50+52*Math.cos(a))),y:Math.min(93,Math.max(7,55+50*Math.sin(a)))};
   w.el=spr(box,"🐺",w.x,w.y,"wolf","สัตว์ร้าย แตะเพื่อไล่");w.el.onclick=()=>{if(w.dead||G.over)return;w.dead=true;G.scared++;w.el.textContent="💨";sfx(900,.08,"square",.06);setTimeout(()=>w.el.remove(),250)};G.wolves.push(w)}
  G.wolves=G.wolves.filter(w=>!w.dead);
  for(const w of G.wolves){const dx=50-w.x,dy=55-w.y,d=Math.hypot(dx,dy);const sp=(d<28&&G.fuel>35)?.1:.5;w.x+=dx/d*sp;w.y+=dy/d*sp;w.el.style.left=w.x+"%";w.el.style.top=w.y+"%";w.el.classList.toggle("flip",dx>0);
   if(d<7){w.dead=true;w.el.remove();G.lives--;sfx(90,.3,"sawtooth",.15);box.classList.remove("hurt");void box.offsetWidth;box.classList.add("hurt");if(G.lives<=0)return end(false,"สัตว์ร้ายบุกเข้ามาถึงกองไฟ! 🐺")}}
  if(!G.meat&&Math.random()<.025){const m={st:"raw",x:10+Math.random()*80,y:Math.random()<.5?14:70,life:7,cook:3};
   m.el=spr(box,"🥩",m.x,m.y,"meat","เนื้อสด แตะเพื่อนำไปย่าง");
   m.el.onclick=()=>{if(G.over)return;if(m.st==="raw"){m.st="cook";m.x=60;m.y=47;m.el.style.left=m.x+"%";m.el.style.top=m.y+"%";m.el.classList.add("cooking");sfx(500,.08)}else if(m.st==="done"){G.brains++;pop(box,"+🧠",m.x,m.y-6);sfx(1046,.15,"triangle");m.el.remove();G.meat=null}};G.meat=m}
  const m=G.meat;if(m){if(m.st==="raw"){m.life-=.1;if(m.life<=0){m.el.remove();G.meat=null}}else if(m.st==="cook"&&G.fuel>0){m.cook-=.1;if(m.cook<=0){m.st="done";m.el.textContent="🍖";m.el.classList.remove("cooking");m.el.classList.add("ready")}}}
  if(G.t<=0)return end(true);
  paintH();
 }
 function end(ok,why){G.over=true;stopLoops();paintH();
  ov(box,ok?`<h3>🌅 รอดมาถึงเช้า!</h3><p>ไฟช่วยให้ทีมรอดชีวิต: ให้<b>ความอบอุ่น</b>ในคืนที่หนาวเย็น <b>ไล่สัตว์ร้าย</b>ได้ ${G.scared} ตัว และ<b>ปรุงอาหารสุก</b> ${G.brains} ชิ้น อาหารสุกย่อยง่าย ช่วยให้สมองพัฒนา</p>`:`<h3>ภารกิจล้มเหลว</h3><p>${why}</p><p>เคล็ดลับ: ถ้าไฟลุกแรง สัตว์ร้ายจะกลัวแสงไฟและเดินช้าลงมาก</p>`,ok?[{t:"รับโบนัส กลับถิ่นฐาน",fn:onWin}]:[{t:"เล่นอีกครั้ง",fn:start}])}
 paintH();
 ov(box,`<h3>🌙 พระอาทิตย์กำลังตกดิน...</h3><p>อากาศยามค่ำคืนเย็นจัด และมีสัตว์ร้ายเดินวนอยู่รอบถ้ำ ทีมต้องรักษากองไฟไว้ให้ได้จนถึงเช้า</p>`,[{t:"เริ่มเอาตัวรอด",fn:start}]);
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function timerHTML(){return `<div class="timer" id="timer"><div class="row"><div><div class="t" id="tt"></div><div class="ph" id="tph"></div></div>
 <div class="btns"><button class="tbtn" id="tlen" title="สลับความยาวเวลา">${T.len/60} นาที</button><button class="tbtn" id="tgo">▶</button><button class="tbtn" id="trs" aria-label="รีเซ็ตเวลา">↺</button></div></div><div class="phases"><span></span><span></span><span></span></div></div>`}
function paintTimer(){const el=$("#tt");if(!el)return;const m=Math.floor(T.left/60),s=T.left%60;el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;const seg=T.len/3;const p=Math.min(2,Math.floor((T.len-T.left)/seg));
 $("#tph").textContent=T.left<=0?"หมดเวลา! เตรียมหมุนเวียนฐาน":`ช่วงที่ ${p+1}: ${PH[p]}`;document.querySelectorAll(".phases span").forEach((x,i)=>x.classList.toggle("on",i<=p));$("#tgo").textContent=T.run?"⏸":"▶";$("#tlen").textContent=T.len/60+" นาที"}
function beep(){[0,.35,.7].forEach(d=>setTimeout(()=>sfx(880,.3,"sine",.2),d*1000))}
function bindTimer(){if(!$("#tt"))return;paintTimer();
 $("#tgo").onclick=()=>{if(T.left<=0)T.left=T.len;T.run=!T.run;clearInterval(T.h);if(T.run)T.h=setInterval(()=>{T.left--;if(T.left%(T.len/3)===0&&T.left>0)beep();if(T.left<=0){T.left=0;T.run=false;clearInterval(T.h);beep();$("#timer")?.classList.add("ring")}paintTimer()},1000);paintTimer()};
 $("#trs").onclick=()=>{T.run=false;clearInterval(T.h);T.left=T.len;$("#timer").classList.remove("ring");paintTimer()};
 $("#tlen").onclick=()=>{if(T.run)return toast("หยุดเวลาก่อนจึงเปลี่ยนได้");T.len=T.len===480?360:480;T.left=T.len;paintTimer()}}

function coach(key,force){const steps=TUT[key];if(!steps)return;S.tut=S.tut||{};if(!force&&S.tut[key])return;S.tut[key]=true;save();
 let i=0;const box=document.createElement("div");box.className="coach";
 box.innerHTML=`<div class="hole"></div><div class="ctip" role="dialog" aria-live="polite"><div class="cc"></div><h4></h4><p></p><div class="cb"><button class="btn ghost" data-k="skip">ข้าม</button><button class="btn" data-k="next">ถัดไป</button></div></div>`;
 document.body.appendChild(box);const hole=box.querySelector(".hole"),tip=box.querySelector(".ctip");
 const place=()=>{const el=document.querySelector(steps[i].sel);if(!el)return;const r=el.getBoundingClientRect(),p=6;
  const top=Math.max(4,r.top-p),bot=Math.min(innerHeight-4,r.bottom+p);Object.assign(hole.style,{left:r.left-p+"px",top:top+"px",width:r.width+2*p+"px",height:Math.max(20,bot-top)+"px"});
  const th=tip.offsetHeight,tw=tip.offsetWidth;let ty;if(bot+12+th<innerHeight)ty=bot+12;else if(top-12-th>0)ty=top-12-th;else ty=innerHeight-th-12;
  tip.style.top=ty+"px";tip.style.left=Math.min(innerWidth-tw-12,Math.max(12,r.left))+"px"};
 const show=()=>{while(i<steps.length&&!document.querySelector(steps[i].sel))i++;if(i>=steps.length)return close();
  const s=steps[i];tip.querySelector(".cc").textContent=`${i+1}/${steps.length}`;tip.querySelector("h4").textContent=s.t;tip.querySelector("p").textContent=s.x;
  tip.querySelector('[data-k="next"]').textContent=i===steps.length-1?"เข้าใจแล้ว เริ่มเลย!":"ถัดไป ▶";
  document.querySelector(s.sel).scrollIntoView({block:"center",behavior:"instant"});requestAnimationFrame(place)};
 const close=()=>{box.remove();removeEventListener("resize",place);removeEventListener("scroll",place,true)};
 box.addEventListener("click",e=>{const k=e.target.dataset.k;if(k==="skip")close();else if(k==="next"){i++;show()}});
 addEventListener("resize",place);addEventListener("scroll",place,true);show()}


/* ================= scoring ================= */
function ledgerSum(){return Object.values(S.ledger).reduce((a,b)=>a+b,0)}
function total(){let t=ledgerSum();for(const z of [1,2,3]){const run=SIM[z]&&SIM[z].stage==="play"?SIM[z].score:0;t+=Math.max(S.simBest[z]||0,run)}return t}
function award1(key,n,label){if(S.ledger[key]!==undefined)return false;S.ledger[key]=n;save();gain(n,label);liveScore(true);return true}
let GN=0;function gain(n,label){const chip=$("#scoreChip");if(!chip)return;const r=chip.getBoundingClientRect();const k=GN++;setTimeout(()=>GN=Math.max(0,GN-1),1600);const g=document.createElement("div");g.className="gain "+(n<0?"neg":"");g.textContent=`${n>0?"+":""}${n} ${label||""}`;g.style.left=(r.left+r.width/2)+"px";g.style.top=(r.bottom+4+k*30)+"px";document.body.appendChild(g);setTimeout(()=>g.remove(),1600);chip.classList.remove("bump");void chip.offsetWidth;chip.classList.add("bump")}
let NOW="อยู่ที่แผนที่";
function setNow(t){if(t===NOW)return;NOW=t;lbPush()}
function liveScore(force){const t=total();const c=$("#scoreChip");if(c)c.textContent=`⭐ ${t} คะแนน`;const rs=$("#runScore");const z=SIMCTX&&SIMCTX.z;if(rs&&z&&SIM[z])rs.textContent=SIM[z].score;lbPush(force)}

function lbSubscribe(){if(!LB.db||!S.player)return;try{LB.unsub&&LB.unsub()}catch(e){}LB.rows=[];
 LB.unsub=LB.db.collection(`rooms/${S.player.room}/players`).onSnapshot(qs=>{LB.rows=qs.docs.map(d=>Object.assign({id:d.id},d.data()));renderRank();if($("#lbList"))renderLB()},err=>{LB.state="error";renderRank()})}
function myRow(){const P=S.player||{};return {name:P.name||"ไม่ระบุชื่อ",mode:P.mode||"solo",members:P.members||[],score:total(),z1:stars(1),z2:stars(2),z3:stars(3),carved:!!S.carved,now:NOW,ts:Date.now()}}
function lbPush(force){if(!LB.db||!S.player||LB.ro)return;if(LB.timer&&!force)return;clearTimeout(LB.timer);const wait=force?800:Math.max(1500,15000-(Date.now()-(LB.last||0)));LB.timer=setTimeout(()=>{LB.timer=null;LB.last=Date.now();lbWrite()},wait)}
async function lbWrite(){if(LB.busy){LB.again=true;return}LB.busy=true;
 try{await LB.db.doc(`rooms/${S.player.room}/players/${S.player.pid}`).set(myRow())}catch(e){if(e&&e.code==="invalid_argument"){LB.ro=true;LB.state="readonly";renderRank()}}
 LB.busy=false;if(LB.again){LB.again=false;lbWrite()}}
function ranked(){const me=S.player&&S.player.pid;let rows=LB.rows.slice();if(!rows.some(r=>r.id===me)&&S.player)rows.push(Object.assign({id:me},myRow()));
 const live=rows.find(r=>r.id===me);if(live)Object.assign(live,{score:total()});return rows.sort((a,b)=>(b.score||0)-(a.score||0)||(a.ts||0)-(b.ts||0))}

 openModal(`<button class="mclose" onclick="closeModal()">✕ ปิด</button><button class="mclose" id="lbBig" style="margin-right:8px">📺 โหมดฉายจอ</button>

 renderLB()}
function renderLB(){const el=$("#lbList");if(!el)return;const me=S.player&&S.player.pid;let all=LB.vrows?LB.vrows.slice():ranked();if(LB.vrows&&S.player&&LB.view===S.player.room){all=all.filter(r=>r.id!==me);all.push(Object.assign({id:me},myRow()))}

 el.innerHTML=`<div class="lbt">${rows.map((r,i)=>`<div class="lbr ${r.id===me?"me":""}"><div class="lbm">${medal(i)}</div><div class="lbn"><b>${r.mode==="group"?"👥":"👤"} ${esc(r.name)}${r.id===me?' <span class="kw">คุณ</span>':""}</b><small>${r.members&&r.members.length?esc(r.members.join(", "))+" · ":""}${esc(r.now||"")}</small></div><div class="lbz">${z(r.z1,"🔥")}${z(r.z2,"🌾")}${z(r.z3,"⚔️")}${r.carved?'<span class="zs full">✍</span>':""}</div><div class="lbs">${r.score||0}</div></div>`).join("")}</div>`}

async function clearRoom(code,del,uid){if(!confirm(del?`ลบห้อง ${roomLabel(code)} และคะแนนทั้งหมด?`:`ล้างคะแนนทุกคนใน ${roomLabel(code)}?`))return;
